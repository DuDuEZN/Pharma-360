# =============================================================================
# Pharma 360 - Configuration nginx pour Windows (deploiement natif, sans Docker)
# =============================================================================
# Ce fichier est un MODELE. install-pharma360.ps1 remplace :
#   __PHARMA_ROOT__  -> chemin du projet (ex: C:/Pharma360)
#   __NGINX_ROOT__   -> chemin de nginx (ex: C:/Pharma360/tools/nginx)
#   __HTTP_PORT__    -> port HTTP (80 par defaut)
# puis l'ecrit dans <projet>\tools\nginx\conf\nginx.conf
#
# Ne pas editer directement la copie generee : modifier ce modele puis relancer
# l'installation (ou deploy/windows/configure-nginx.ps1).
# =============================================================================

worker_processes 2;
pid "__NGINX_ROOT__/logs/nginx.pid";
error_log "__NGINX_ROOT__/logs/error.log" warn;

events {
    worker_connections 1024;
}

http {
    include       "__NGINX_ROOT__/conf/mime.types";
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log "__NGINX_ROOT__/logs/access.log" main;

    sendfile            on;
    tcp_nopush          on;
    server_tokens       off;
    keepalive_timeout   75s;

    client_max_body_size    100M;
    client_body_buffer_size 128k;
    client_header_timeout   60s;
    client_body_timeout     60s;
    send_timeout            60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Repertoires temporaires (relatifs au prefixe nginx = tools\nginx)
    client_body_temp_path "__NGINX_ROOT__/temp/client_body";
    proxy_temp_path       "__NGINX_ROOT__/temp/proxy";
    fastcgi_temp_path     "__NGINX_ROOT__/temp/fastcgi";
    uwsgi_temp_path       "__NGINX_ROOT__/temp/uwsgi";
    scgi_temp_path        "__NGINX_ROOT__/temp/scgi";

    proxy_cache_path "__NGINX_ROOT__/temp/cache" levels=1:2 keys_zone=pharma360_cache:10m
                     inactive=60m use_temp_path=off max_size=100m;

    # Limitation de debit / connexions
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # WebSocket : upgrade uniquement quand le client le demande
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen __HTTP_PORT__;
        server_name _;

        root  "__PHARMA_ROOT__/frontend/dist";
        index index.html;

        # En-tetes de securite
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self';" always;

        # Bundles fingerprintes : cache long
        location /assets/ {
            try_files $uri =404;
            expires 365d;
        }

        # Application React (SPA)
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }

        # WebSocket caisse / ventes -> backend FastAPI
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API backend
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            limit_req zone=api_limit burst=200 nodelay;
            limit_conn addr 20;

            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Service IA
        location = /ia {
            return 301 /ia/;
        }

        location /ia/ {
            proxy_pass http://127.0.0.1:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Fichiers statiques du build
        location /static/ {
            alias "__PHARMA_ROOT__/frontend/dist/static/";
            expires 365d;
        }

        # Pieces jointes (factures, documents) servies depuis le disque
        location /uploads/ {
            alias "__PHARMA_ROOT__/uploads/";
            expires -1;
            add_header Cache-Control "no-store";
        }

        # Sonde de disponibilite (nginx uniquement)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx"}';
        }
    }

    # =========================================================================
    # HTTPS (optionnel) - decommenter APRES avoir depose un certificat dans
    # tools\nginx\conf\ssl\ (fullchain.pem + privkey.pem), et ajouter
    # "return 301 https://$host$request_uri;" dans le serveur HTTP ci-dessus.
    # -------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name pharma.local;
    #
    #     ssl_certificate     "__NGINX_ROOT__/conf/ssl/fullchain.pem";
    #     ssl_certificate_key "__NGINX_ROOT__/conf/ssl/privkey.pem";
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     root  "__PHARMA_ROOT__/frontend/dist";
    #     index index.html;
    #
    #     # Reprendre ici les memes blocs location que le serveur HTTP.
    # }
    # =========================================================================
}
