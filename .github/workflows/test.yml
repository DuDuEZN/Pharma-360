name: Test

# ID Tâche: QA-005, QA-006, QA-007, QA-008
# Responsable: DevOps Engineer / QA Engineer
# Description: Exécute tous les tests (unitaires, intégration, frontend, IA)

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov anyio==3.7.1
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U test_user -d pharma360_test; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/10)"
            sleep 5
          done
      
      - name: Create test database
        run: |
          PGPASSWORD=test_pass psql -h localhost -p 5432 -U test_user -d pharma360_test -f scripts/init-db.sql
      
      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --tb=short --disable-warnings -x
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          APP_ENV: test
          APP_DEBUG: true
          CACHE_ENABLED: false
      
      - name: Generate coverage report
        run: |
          cd backend
          pytest tests/ --cov=backend --cov-report=xml:coverage.xml --cov-report=term -v
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          APP_ENV: test
          APP_DEBUG: true
          CACHE_ENABLED: false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    name: Tests Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm test
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  test-integration:
    name: Tests d'Intégration
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U test_user -d pharma360_test; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/10)"
            sleep 5
          done
      
      - name: Create test database
        run: |
          PGPASSWORD=test_pass psql -h localhost -p 5432 -U test_user -d pharma360_test -f scripts/init-db.sql
      
      - name: Run integration tests
        run: |
          cd backend
          pytest tests/test_integration_workflows.py -v --tb=short --disable-warnings
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          APP_ENV: test
          APP_DEBUG: true
          CACHE_ENABLED: false

  test-ia:
    name: Tests Module IA
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install IA dependencies
        run: |
          cd ia
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run IA tests
        run: |
          cd ia
          pytest tests/ -v --tb=short --disable-warnings -x
        env:
          APP_ENV: test
          APP_DEBUG: true

  test-all:
    name: Tous les Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-integration, test-ia]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: All tests passed
        run: echo "✅ Tous les tests ont réussi !"
