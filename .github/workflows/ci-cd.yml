name: Pharmacie 360° CI/CD

# Workflow pour les tests automatisés et le déploiement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Environnement
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # =============================================================================
  # Test Backend
  # =============================================================================
  test-backend:
    name: Test Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pharma360_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/pharma360_test
        run: |
          cd backend && python -m pytest tests/ --ignore=tests/test_deployment.py --cov=./ --cov-report=xml --cov-report=term -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # =============================================================================
  # Test Frontend
  # =============================================================================
  test-frontend:
    name: Test Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build application
        run: |
          cd frontend
          npm run build

  # =============================================================================
  # Lint et Format
  # =============================================================================
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install black==26.10.1 isort==9.0.2

      - name: Verify Python formatting
        run: |
          echo "🔍 Verifying Python formatting..."
          python -m black --check backend/ ia/
          python -m isort --check-only backend/ ia/
          echo "✅ All Python formatting checks passed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        run: |
          cd frontend
          npm install --save-dev eslint

      - name: Check JavaScript formatting
        run: |
          cd frontend
          npx eslint . --ext js,jsx

  # =============================================================================
  # Build Docker Images
  # =============================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # `secrets` n'est pas autorisé dans les conditions `if:` : on passe par l'environnement du job
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -f docker/backend.Dockerfile -t pharma360-backend:latest .

      - name: Build Frontend Image
        run: |
          docker build -f docker/frontend.Dockerfile -t pharma360-frontend:latest .

      - name: Build IA Image
        run: |
          docker build -f docker/ia.Dockerfile -t pharma360-ia:latest .

      - name: Push Images to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        run: |
          for image in pharma360-backend pharma360-frontend pharma360-ia; do
            docker tag "${image}:latest" "${DOCKER_HUB_USERNAME}/${image}:latest"
            docker push "${DOCKER_HUB_USERNAME}/${image}:latest"
          done

  # =============================================================================
  # Déploiement (Optionnel - pour production)
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint-and-format, build-docker]
    # Activer en créant la variable de dépôt DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions > Variables)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/pharma360
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            docker image prune -f
